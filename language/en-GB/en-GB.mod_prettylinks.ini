MOD_PRETTYLINKS_FIELD_INFO_DESC="<p>Add your links on the Pretty Links tab. Icons use Font Awesome classes, for example <code>fas fa-home</code>; Font Awesome is loaded automatically when a link has an icon. Every link needs text: with <em>Hide text on mobile</em> only the icon is visible on small screens, but screen readers still read the text.</p>"
